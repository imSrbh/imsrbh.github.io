<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Beyond Vector Search</title>
  <desc id="desc">SQL and documents connect through a knowledge graph to support answers with evidence.</desc>
