  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1100" cy="100" r="260" fill="#22d3ee" opacity="0.06"/>
  <g font-family="Arial, sans-serif">
    <text x="70" y="98" fill="#67e8f9" font-size="19" font-weight="700" letter-spacing="3">RETRIEVAL · GRAPHS · AGENTS</text>
    <text x="70" y="204" fill="#fff" font-size="64" font-weight="700">Beyond Vector Search</text>
    <text x="72" y="260" fill="#cbd5e1" font-size="27">Connecting SQL and documents with knowledge graphs</text>
