<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Connecting schema entities and document context</title>
  <desc id="desc">Returns connects to order items, which connects to products through foreign keys. Products has a candidate association with a return policy supported by a source passage. The extracted association requires applicability checks.</desc>
  <rect width="1000" height="620" rx="18" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="500" y="50" font-size="30" font-weight="700" fill="#0f172a">A schema graph meets document evidence</text>
    <g fill="none" stroke="#2563eb" stroke-width="3"><path d="M270 180H390"/><path d="M610 180H730"/></g>
    <path d="M840 220V340H640" fill="none" stroke="#0f766e" stroke-width="3" stroke-dasharray="9 7"/>
    <path d="M500 380V450" fill="none" stroke="#0f766e" stroke-width="3" stroke-dasharray="9 7"/>
    <g fill="#dbeafe" stroke="#93c5fd" stroke-width="2"><rect x="50" y="140" width="220" height="80" rx="14"/><rect x="390" y="140" width="220" height="80" rx="14"/><rect x="730" y="140" width="220" height="80" rx="14"/></g>
    <g fill="#0f172a" font-size="25" font-weight="700"><text x="160" y="189">Returns</text><text x="500" y="189">OrderItems</text><text x="840" y="189">Products</text></g>
    <g fill="#1d4ed8" font-size="17"><text x="330" y="165">foreign key</text><text x="670" y="165">foreign key</text></g>
    <rect x="360" y="300" width="280" height="80" rx="14" fill="#ccfbf1" stroke="#5eead4" stroke-width="2"/>
    <text x="500" y="349" fill="#0f172a" font-size="25" font-weight="700">Return policy</text>
    <text x="732" y="286" fill="#0f766e" font-size="18">Candidate association</text>
    <text x="623" y="422" fill="#0f766e" font-size="18">Supported by</text>
    <rect x="230" y="450" width="540" height="78" rx="14" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
    <text x="500" y="482" fill="#0f172a" font-size="22">Source passage + page + document version</text>
    <text x="500" y="510" fill="#475569" font-size="18">Example: unopened accessories within thirty days</text>
    <text x="500" y="580" fill="#475569" font-size="20">Check category, dates, region, and exceptions before applying a policy.</text>
  </g>
</svg>
