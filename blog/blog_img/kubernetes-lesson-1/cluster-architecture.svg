<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" role="img" aria-labelledby="title desc">
  <title id="title">A simplified Kubernetes cluster</title>
  <desc id="desc">Kubectl sends a request to the control plane. The control plane coordinates worker nodes that run application Pods.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
  </defs>
  <rect width="900" height="580" rx="20" fill="#f8fafc"/>
  <text x="450" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">A simplified Kubernetes cluster</text>
  <rect x="35" y="90" width="155" height="95" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="112" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#075985">You + kubectl</text>
  <text x="112" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">Submit desired state</text>
  <rect x="245" y="80" width="620" height="190" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="555" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1e40af">Control plane</text>
  <rect x="270" y="140" width="125" height="75" rx="9" fill="#fff" stroke="#93c5fd"/>
  <text x="332" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1e293b">API server</text>
  <text x="332" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Receives requests</text>
  <rect x="410" y="140" width="110" height="75" rx="9" fill="#fff" stroke="#93c5fd"/>
  <text x="465" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1e293b">etcd</text>
  <text x="465" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Stores state</text>
  <rect x="535" y="140" width="125" height="75" rx="9" fill="#fff" stroke="#93c5fd"/>
  <text x="597" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1e293b">Scheduler</text>
  <text x="597" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Selects nodes</text>
  <rect x="675" y="140" width="165" height="75" rx="9" fill="#fff" stroke="#93c5fd"/>
  <text x="757" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1e293b">Controllers</text>
  <text x="757" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Reconcile state</text>
  <path d="M 190 137 L 263 167" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 555 270 L 555 310" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="570" y="296" font-family="Arial, sans-serif" font-size="14" fill="#475569">coordinates workloads</text>
  <rect x="245" y="320" width="295" height="205" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="392" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#166534">Worker node A</text>
  <text x="392" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334155">kubelet + container runtime</text>
  <rect x="270" y="405" width="110" height="75" rx="9" fill="#fff" stroke="#86efac"/>
  <text x="325" y="437" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#166534">Pod 1</text>
  <text x="325" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">App container</text>
  <rect x="405" y="405" width="110" height="75" rx="9" fill="#fff" stroke="#86efac"/>
  <text x="460" y="437" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#166534">Pod 2</text>
  <text x="460" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">App container</text>
  <rect x="570" y="320" width="295" height="205" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="717" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#166534">Worker node B</text>
  <text x="717" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334155">kubelet + container runtime</text>
  <rect x="662" y="405" width="110" height="75" rx="9" fill="#fff" stroke="#86efac"/>
  <text x="717" y="437" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#166534">Pod 3</text>
  <text x="717" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">App container</text>
  <text x="450" y="557" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Conceptual example: your local kind cluster may have a different node layout.</text>
</svg>
